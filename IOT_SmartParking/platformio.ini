; PlatformIO Project Configuration File
;
;   SmartParking Multi-Board Distributed Hardware Architecture
;   Unified firmware source codebase with role-based compile-time profiles.

[platformio]
default_envs = gate, row_e, row_a, row_b, row_c, row_d

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit NeoPixel
    knolleary/PubSubClient
    madhephaestus/ESP32Servo
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    bblanchon/ArduinoJson @ ^6.21.5

build_flags =
    -D ARDUINOJSON_USE_LONG_LONG=1

; =====================================================
; BOARD 1: GATE CONTROLLER (Barie In/Out, HC-SR04 Cổng vào, 3 Nút nhấn, LCD 20x4 I2C)
; =====================================================
[env:gate]
build_flags =
    ${env.build_flags}
    -D NODE_ROLE_GATE=1
    -D NODE_ID=\"esp32_gate\"

; =====================================================
; BOARD 2: ROW E CONTROLLER (8 cảm biến ô E1-E8 & 8 LED NeoPixel)
; =====================================================
[env:row_e]
build_flags =
    ${env.build_flags}
    -D NODE_ROLE_ROW=1
    -D NODE_ID=\"esp32_row_e\"
    -D ROW_PREFIX=\"E\"
    -D PIXEL_OFFSET=10
    -D PIXEL_COUNT=8

; =====================================================
; BOARDS 3-6: ROW A-D CONTROLLERS (Mã nguồn sẵn sàng nạp cho phần cứng thật)
; =====================================================
[env:row_a]
build_flags =
    ${env.build_flags}
    -D NODE_ROLE_ROW=1
    -D NODE_ID=\"esp32_row_a\"
    -D ROW_PREFIX=\"A\"
    -D PIXEL_OFFSET=42
    -D PIXEL_COUNT=8

[env:row_b]
build_flags =
    ${env.build_flags}
    -D NODE_ROLE_ROW=1
    -D NODE_ID=\"esp32_row_b\"
    -D ROW_PREFIX=\"B\"
    -D PIXEL_OFFSET=34
    -D PIXEL_COUNT=8

[env:row_c]
build_flags =
    ${env.build_flags}
    -D NODE_ROLE_ROW=1
    -D NODE_ID=\"esp32_row_c\"
    -D ROW_PREFIX=\"C\"
    -D PIXEL_OFFSET=26
    -D PIXEL_COUNT=8

[env:row_d]
build_flags =
    ${env.build_flags}
    -D NODE_ROLE_ROW=1
    -D NODE_ID=\"esp32_row_d\"
    -D ROW_PREFIX=\"D\"
    -D PIXEL_OFFSET=18
    -D PIXEL_COUNT=8
